services:
  api:
    command: npm run start:dev --workspace @nexly/api
    volumes:
      - ./apps/api:/app/apps/api
      - /app/apps/api/node_modules
      - /app/node_modules

  web:
    command: npm exec --workspace @nexly/web -- next dev -p 3000
    volumes:
      - ./apps/web:/app/apps/web
      - /app/apps/web/node_modules
      - /app/apps/web/.next
      - /app/node_modules
