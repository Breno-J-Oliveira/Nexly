name: Backup do banco

on:
  schedule:
    # Backup diário às 06:00 UTC (~03:00 BRT — janela de menor uso).
    - cron: '0 6 * * *'
    # Teste de restore semanal, domingo às 07:00 UTC.
    - cron: '0 7 * * 0'
  workflow_dispatch:
    inputs:
      tarefa:
        description: 'O que executar'
        type: choice
        default: backup
        options: [backup, restore-test, verificar]

permissions:
  contents: read
  issues: write

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
  AWS_DEFAULT_REGION: ${{ vars.BACKUP_S3_REGION || 'auto' }}
  AWS_PAGER: ''
  TZ: UTC

jobs:
  backup:
    name: Backup (pg_dump cifrado)
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '0 6 * * *')
      || (github.event_name == 'workflow_dispatch' && inputs.tarefa == 'backup')
    steps:
      - uses: actions/checkout@v6

      - name: Valida configuração do backup
        env:
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          BKP_PASSPHRASE: ${{ secrets.BKP_PASSPHRASE }}
          S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
        run: |
          for required in BACKUP_DATABASE_URL BKP_PASSPHRASE S3_BUCKET AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY; do
            if [ -z "${!required}" ]; then echo "::error::Configure o secret correspondente a $required para ativar o backup."; exit 1; fi
          done
          aws --version

      - uses: ./.github/actions/backup-tools

      - name: Executa o backup
        env:
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          BKP_PASSPHRASE: ${{ secrets.BKP_PASSPHRASE }}
          S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
          S3_ENDPOINT: ${{ secrets.BACKUP_S3_ENDPOINT }}
        run: bash scripts/backup-db.sh

  restore-test:
    name: Teste de restore (semanal)
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '0 7 * * 0')
      || (github.event_name == 'workflow_dispatch' && inputs.tarefa == 'restore-test')
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/backup-tools

      - name: Executa o teste de restore
        id: restore
        # continue-on-error para poder abrir a issue antes de falhar o job.
        continue-on-error: true
        env:
          RESTORE_ADMIN_URL: ${{ secrets.RESTORE_ADMIN_URL }}
          BKP_PASSPHRASE: ${{ secrets.BKP_PASSPHRASE }}
          S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
          S3_ENDPOINT: ${{ secrets.BACKUP_S3_ENDPOINT }}
        run: bash scripts/restore-test.sh

      - name: Abre issue quando o restore falha
        if: steps.restore.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const titulo = '🚨 Teste de restore do backup FALHOU';
            const corpo = [
              'O teste semanal de restore não passou.',
              '',
              `- Workflow: ${context.workflow}`,
              `- Execução: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              '**Enquanto isso, considere os backups NÃO confiáveis.**',
              '',
              'Checklist:',
              '- [ ] O backup diário está rodando? (`scripts/backup-db.sh`)',
              '- [ ] A senha (`BKP_PASSPHRASE`) mudou?',
              '- [ ] O bucket está acessível com as credenciais atuais?',
              '- [ ] O dump mais recente tem um tamanho plausível?',
            ].join('\n');

            const existentes = await github.rest.issues.listForRepo({
              ...context.repo,
              state: 'open',
              labels: 'backup',
            });
            if (existentes.data.some((i) => i.title === titulo)) return;

            await github.rest.issues.create({
              ...context.repo,
              title: titulo,
              body: corpo,
              labels: ['backup', 'bug'],
            });

      - name: Falha o job se o restore falhou
        if: steps.restore.outcome == 'failure'
        run: exit 1

  verificar:
    name: Backup recente? (alerta se > 26h)
    runs-on: ubuntu-latest
    # Roda em todo schedule (para acusar se o backup diário não rodou) e no
    # dispatch manual com a tarefa "verificar".
    if: github.event_name == 'schedule' || inputs.tarefa == 'verificar'
    steps:
      - uses: actions/checkout@v6
      - name: Confere AWS CLI do runner
        run: aws --version
      - name: Verifica a idade do último backup
        env:
          S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
          S3_ENDPOINT: ${{ secrets.BACKUP_S3_ENDPOINT }}
        run: |
          : "${S3_BUCKET:?Configure BACKUP_S3_BUCKET}"
          : "${AWS_ACCESS_KEY_ID:?Configure BACKUP_S3_ACCESS_KEY_ID}"
          : "${AWS_SECRET_ACCESS_KEY:?Configure BACKUP_S3_SECRET_ACCESS_KEY}"
          AWS_ARGS=()
          [ -n "$S3_ENDPOINT" ] && AWS_ARGS+=(--endpoint-url "$S3_ENDPOINT")
          ULTIMO="$(aws s3 ls "s3://$S3_BUCKET/postgres/" "${AWS_ARGS[@]}" \
            | awk '{print $1" "$2" "$3" "$4}' | sort | tail -1)"
          if [ -z "$ULTIMO" ]; then
            echo "::error::Nenhum backup encontrado no bucket."
            exit 1
          fi
          echo "Último backup: $ULTIMO"
          QUANDO="$(echo "$ULTIMO" | awk '{print $1" "$2}')"
          IDADE_H="$(( ( $(date -u +%s) - $(date -u -d "$QUANDO" +%s) ) / 3600 ))"
          echo "Idade: ${IDADE_H}h"
          if [ "$IDADE_H" -gt 26 ]; then
            echo "::error::O último backup tem ${IDADE_H}h (> 26h). Verifique o workflow de backup."
            exit 1
          fi
          echo "✅ Backup recente (${IDADE_H}h)."
