name: CI

on:
  push:
    branches: [main, dev]
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  containers:
    name: Container (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [api, web]
    steps:
      - uses: actions/checkout@v6
      - name: Build da imagem de produção
        run: docker build --target production --build-arg NEXT_PUBLIC_API_URL=http://localhost:3001 -f apps/${{ matrix.app }}/Dockerfile -t nexly-${{ matrix.app }}:test .
      - name: Confere usuário e módulos do backend
        if: matrix.app == 'api'
        run: |
          test "$(docker image inspect nexly-api:test --format '{{.Config.User}}')" = node
          docker run --rm --workdir /app/apps/api --entrypoint node nexly-api:test -e "require('@nestjs/core'); require('@nexly/shared'); require('@prisma/client'); console.log('Módulos do backend disponíveis')"
          docker run --rm --entrypoint npm nexly-api:test exec --offline --workspace @nexly/api -- prisma --version
      - name: Confere usuário e arquivos do frontend
        if: matrix.app == 'web'
        run: |
          test "$(docker image inspect nexly-web:test --format '{{.Config.User}}')" = node
          docker run --rm --workdir /app/apps/web --entrypoint node nexly-web:test -e "const fs=require('fs'); require('next'); if(!fs.existsSync('next.config.mjs')||!fs.existsSync('content/blog'))process.exit(1); console.log('Frontend disponível')"
  typecheck-api:
    name: Typecheck API
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nexly
          POSTGRES_PASSWORD: nexly_test_password
          POSTGRES_DB: nexly_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexly -d nexly_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://nexly:nexly_test_password@localhost:5432/nexly_test?schema=public
      DIRECT_URL: postgresql://nexly:nexly_test_password@localhost:5432/nexly_test?schema=public
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24.18.0'
          cache: 'npm'
      - run: npm ci
      - run: npm run build --workspace @nexly/shared
      - run: npx prisma generate --schema apps/api/prisma/schema.prisma
      - run: cd apps/api && npx tsc --noEmit
      - run: npm run typecheck:e2e

  typecheck-web:
    name: Typecheck Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24.18.0'
          cache: 'npm'
      - run: npm ci
      - run: npm run build --workspace @nexly/shared
      - run: npm run typecheck --workspace @nexly/web

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24.18.0'
          cache: 'npm'
      - run: npm ci
      - run: npm run build --workspace @nexly/shared
      - run: npx prisma generate --schema apps/api/prisma/schema.prisma
      - run: npm run lint --if-present
      - run: node scripts/verify-sql-lint.cjs

  test-api:
    name: Tests API
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nexly
          POSTGRES_PASSWORD: nexly_test_password
          POSTGRES_DB: nexly_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexly -d nexly_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://nexly:nexly_test_password@localhost:5432/nexly_test?schema=public
      DIRECT_URL: postgresql://nexly:nexly_test_password@localhost:5432/nexly_test?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_PRIVATE_KEY: ${{ secrets.JWT_PRIVATE_KEY }}
      JWT_PUBLIC_KEY: ${{ secrets.JWT_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24.18.0'
          cache: 'npm'
      - run: npm ci
      - run: npm run build --workspace @nexly/shared
      - run: npx prisma generate --schema apps/api/prisma/schema.prisma
      - run: npx prisma migrate deploy --schema apps/api/prisma/schema.prisma
      - run: cd apps/api && npx jest --passWithNoTests

  backup-scripts:
    name: Scripts de backup/restore
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: nexly
          POSTGRES_PASSWORD: nexly_test_password
          POSTGRES_DB: nexly_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexly -d nexly_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://nexly:nexly_test_password@localhost:5432/nexly_test?schema=public
      DIRECT_URL: postgresql://nexly:nexly_test_password@localhost:5432/nexly_test?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_PRIVATE_KEY: ${{ secrets.JWT_PRIVATE_KEY }}
      JWT_PUBLIC_KEY: ${{ secrets.JWT_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24.18.0'
          cache: 'npm'
      - uses: ./.github/actions/backup-tools
      - run: npm ci
      - run: npm run build --workspace @nexly/shared
      - run: npx prisma generate --schema apps/api/prisma/schema.prisma
      - run: npx prisma migrate deploy --schema apps/api/prisma/schema.prisma
      - run: npm run seed --workspace @nexly/api
      - name: Backup (dump cifrado)
        env:
          BACKUP_DATABASE_URL: postgresql://nexly:nexly_test_password@localhost:5432/nexly_test
          BKP_PASSPHRASE: senha-de-teste
        run: bash scripts/backup-db.sh
      - name: Confere que o dump está de fato cifrado
        run: |
          DUMP="$(ls backups/*.dump.gpg | head -1)"
          echo "arquivo: $DUMP ($(wc -c < "$DUMP") bytes)"
          # pg_dump --format=custom começa com o magic "PGDMP" (5 bytes).
          if head -c 5 "$DUMP" | grep -q PGDMP; then
            echo "::error::O backup NÃO está cifrado (magic PGDMP visível)."
            exit 1
          fi
          echo "✅ Backup cifrado."
      - name: Restore em banco descartável
        env:
          RESTORE_ADMIN_URL: postgresql://nexly:nexly_test_password@localhost:5432/postgres
          BKP_PASSPHRASE: senha-de-teste
        run: |
          export DUMP_FILE="$PWD/$(ls backups/*.dump.gpg | head -1)"
          bash scripts/restore-test.sh
      - name: Confere que não sobrou banco de teste
        run: |
          EXISTE="$(psql "postgresql://nexly:nexly_test_password@localhost:5432/postgres" -tAc \
            "SELECT count(*) FROM pg_database WHERE datname LIKE 'nexly_restore_test%'")"
          if [ "$EXISTE" != "0" ]; then
            echo "::error::O banco de teste não foi limpo (cleanup falhou)."
            exit 1
          fi
          echo "✅ Cleanup OK."

      - name: Confere salvaguardas do backup e restore
        env:
          BACKUP_DATABASE_URL: postgresql://nexly:nexly_test_password@localhost:5432/nexly_test
          RESTORE_ADMIN_URL: postgresql://nexly:nexly_test_password@localhost:5432/postgres
          BKP_PASSPHRASE: senha-de-teste
        run: |
          export DUMP_FILE="$PWD/$(ls backups/*.dump.gpg | head -1)"
          bash scripts/test-backup-safety.sh

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: [typecheck-api, typecheck-web, lint, test-api]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nexly
          POSTGRES_PASSWORD: nexly_test_password
          POSTGRES_DB: nexly_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexly -d nexly_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://nexly:nexly_test_password@localhost:5432/nexly_test?schema=public
      DIRECT_URL: postgresql://nexly:nexly_test_password@localhost:5432/nexly_test?schema=public
      REDIS_URL: redis://localhost:6379
      BASE_URL: http://localhost:3000
      CORS_ORIGIN: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:3001
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24.18.0'
          cache: 'npm'
      - run: npm ci
      - run: npm run build --workspace @nexly/shared
      - run: npx prisma generate --schema apps/api/prisma/schema.prisma
      - run: npx prisma migrate deploy --schema apps/api/prisma/schema.prisma
      - run: npm run seed --workspace @nexly/api
      - run: npm run build --workspace @nexly/api
      - run: npm run build --workspace @nexly/web
      - run: npx playwright install --with-deps chromium
      - name: Inicia API e web em background
        run: |
          NODE_ENV=development node apps/api/dist/src/main.js > /tmp/api.log 2>&1 &
          npm run start --workspace @nexly/web > /tmp/web.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:3001/api/health >/dev/null && curl -fsS http://localhost:3000/login >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          tail -n 30 /tmp/api.log /tmp/web.log
          exit 1
      - run: npx playwright test
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
