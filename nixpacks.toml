# Nexly API — configuração de build para Railway/Nixpacks
[phases.setup]
aptPkgs = ["...", "curl", "xz-utils", "ca-certificates"]
cmds = ["bash scripts/install-node-runtime.sh", "..."]
paths = ["/opt/nexly-node/bin"]

[phases.install]
cmds = ["node scripts/check-node-version.cjs", "npm ci --include=dev"]

[phases.build]
cmds = [
  "npm run build --workspace @nexly/shared",
  "npx prisma generate --schema apps/api/prisma/schema.prisma",
  "npm run build --workspace @nexly/api"
]

[start]
cmd = "npx prisma migrate deploy --schema apps/api/prisma/schema.prisma && NODE_ENV=production node apps/api/dist/src/main.js"
